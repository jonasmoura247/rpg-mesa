<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel D&D — Costa da Travessia</title>
  <link rel="stylesheet" href="css/estilo.css" />
  <script>
    // Aplica o tema antes da primeira pintura da página, pra evitar um flash
    // do tema claro (padrão do CSS) antes do tema.js rodar em DOMContentLoaded.
    // Duplica a lógica mínima de detecção de js/tema.js de propósito — precisa
    // ser síncrona e bloqueante aqui, sem esperar o carregamento de outro arquivo.
    (function () {
      try {
        var temaSalvo = localStorage.getItem('painel-ded-tema');
        var prefereEscuro = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-tema', temaSalvo || (prefereEscuro ? 'escuro' : 'claro'));
      } catch (erro) {
        // localStorage indisponível — mantém o tema claro padrão do CSS
      }
    })();
  </script>
</head>
<body>
  <div class="layout">
    <nav class="barra-lateral">
      <div class="cabecalho-barra-lateral">
        <h1>Costa da Travessia</h1>
        <button id="botao-tema" class="botao-tema" title="Alternar modo claro/escuro">🌙</button>
      </div>
      <select id="seletor-campanha" class="seletor-campanha"></select>
      <button id="botao-quadro-quests" class="botao-navegacao-fixo" type="button">📋 Quadro de Quests</button>
      <button id="botao-jogadores" class="botao-navegacao-fixo" type="button">🧑‍🤝‍🧑 Jogadores</button>
      <input
        type="search"
        id="campo-busca"
        class="campo-busca"
        placeholder="Buscar nota…"
        autocomplete="off"
      />
      <div class="acoes-arvore">
        <button id="botao-expandir-tudo" class="botao-secundario" type="button">▾ Expandir tudo</button>
        <button id="botao-recolher-tudo" class="botao-secundario" type="button">▸ Recolher tudo</button>
      </div>
      <div id="arvore-navegacao"></div>
      <div class="cabecalho-historico">
        <h2>Últimas Rolagens</h2>
        <button id="botao-limpar-historico" class="botao-limpar-historico" title="Limpar histórico">🗑️</button>
      </div>
      <ul id="historico-rolagens">
        <li class="historico-vazio">Nenhuma rolagem ainda.</li>
      </ul>
    </nav>
    <main id="conteudo-principal" class="conteudo-principal">
      <div class="estado-vazio">
        <span class="estado-vazio-icone">🗺️</span>
        <p>Selecione uma nota na barra lateral pra começar.</p>
      </div>
    </main>
  </div>
  <script src="js/tema.js?v=3"></script>
  <script src="js/api.js?v=3"></script>
  <script src="js/campanha.js?v=3"></script>
  <script src="js/markdown.js?v=3"></script>
  <script src="js/rolador.js?v=3"></script>
  <script src="js/quests.js?v=3"></script>
  <script src="js/personagens.js?v=3"></script>
  <script src="js/app.js?v=3"></script>
</body>
</html>
