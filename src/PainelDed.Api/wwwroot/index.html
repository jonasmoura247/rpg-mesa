<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel D&D — Costa da Travessia</title>
  <link rel="stylesheet" href="css/estilo.css" />
  <script>
    // Aplica o tema antes da primeira pintura da página, pra evitar um flash
    // do tema claro (padrão do CSS) antes do tema.js rodar em DOMContentLoaded.
    // Duplica a lógica mínima de detecção de js/tema.js de propósito — precisa
    // ser síncrona e bloqueante aqui, sem esperar o carregamento de outro arquivo.
    (function () {
      try {
        var temaSalvo = localStorage.getItem('painel-ded-tema');
        var prefereEscuro = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-tema', temaSalvo || (prefereEscuro ? 'escuro' : 'claro'));
      } catch (erro) {
        // localStorage indisponível — mantém o tema claro padrão do CSS
      }
    })();
  </script>
</head>
<body>
  <div class="layout">
    <nav class="barra-lateral">
      <div class="cabecalho-barra-lateral">
        <h1>Costa da Travessia</h1>
        <button id="botao-tema" class="botao-tema" title="Alternar modo claro/escuro">🌙</button>
      </div>
      <div id="arvore-navegacao"></div>
      <h2>Últimas Rolagens</h2>
      <ul id="historico-rolagens"></ul>
    </nav>
    <main id="conteudo-principal" class="conteudo-principal">
      <p>Selecione uma nota na barra lateral.</p>
    </main>
  </div>
  <script src="js/tema.js"></script>
  <script src="js/api.js"></script>
  <script src="js/rolador.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
